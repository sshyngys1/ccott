commands.allow = ["settings_get", "settings_set", "window_list_monitors", "window_recent_fullscreen_apps", "window_recent_maximized_apps", "hotkeys_status", "updater_check", "updater_install", "capture_ocr_languages", "weather_search_location", "weather_locate", "agents_hooks_status", "agents_set_hooks"]
