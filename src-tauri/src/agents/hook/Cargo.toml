[package]
name = "ccott-hook"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately independent of the GUI package and its build script / imports.
[workspace]

[[bin]]
name = "ccott-hook"
path = "main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
